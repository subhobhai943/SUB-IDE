name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: sub-ide-linux-x86_64
          - os: windows-latest
            artifact: sub-ide-windows-x86_64
          - os: macos-latest
            artifact: sub-ide-macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      # ---------- Linux: .deb ----------
      - name: Install cargo-deb (Linux)
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --locked
      - name: Build .deb (Linux)
        if: runner.os == 'Linux'
        run: cargo deb --no-build

      # ---------- Windows: .msi ----------
      - name: Install cargo-wix (Windows)
        if: runner.os == 'Windows'
        run: cargo install cargo-wix --locked
      - name: Build .msi (Windows)
        if: runner.os == 'Windows'
        run: cargo wix --no-build

      # ---------- macOS: .app ----------
      - name: Install cargo-bundle (macOS)
        if: runner.os == 'macOS'
        run: cargo install cargo-bundle --locked
      - name: Build .app (macOS)
        if: runner.os == 'macOS'
        run: cargo bundle --release
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: |
          cd target/release/bundle/osx
          zip -r "${{ github.workspace }}/${{ matrix.artifact }}.zip" *.app

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/sub-ide
            target/release/sub-ide.exe
            target/debian/*.deb
            target/wix/*.msi
            ${{ matrix.artifact }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
